<div class="max-w-3xl mx-auto p-6">
  <h1 class="text-2xl font-semibold text-gray-800 mb-6">Edit Task</h1>

  <form [formGroup]="form" (ngSubmit)="save()" class="space-y-6">
    <!-- Title -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"> Title </label>
      <input
        type="text"
        formControlName="title"
        class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
        placeholder="Task title"
      />
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"> Description </label>
      <textarea
        rows="4"
        formControlName="description"
        class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
        placeholder="Task details"
      ></textarea>
    </div>

    <!-- Due Date + Status -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"> Due Date </label>
        <input
          type="date"
          formControlName="dueDate"
          class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"> Status </label>
        <select
          formControlName="status"
          class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
        >
          <option [value]="taskStatus.New">New</option>
          <option [value]="taskStatus.InProgress">In Progress</option>
          <option [value]="taskStatus.Completed">Completed</option>
        </select>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3 pt-4">
      <button
        type="button"
        class="px-4 py-2 text-gray-700 border rounded-md hover:bg-gray-50"
        routerLink="/tasks"
      >
        Cancel
      </button>

      <button
        type="submit"
        [disabled]="form.invalid"
        class="px-4 py-2 rounded-md text-white bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 disabled:cursor-not-allowed"
      >
        Save Changes
      </button>
    </div>
  </form>
</div>
