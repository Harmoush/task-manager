<div
  class="bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition p-4 flex flex-col gap-3 mb-2"
>
  <!-- Header -->
  <div class="flex justify-between items-start gap-3">
    <div class="flex flex-col">
      <h3 class="text-sm font-semibold text-gray-900 leading-tight">
        {{ task().title }}
      </h3>
      <span class="text-xs text-gray-400"> TASK-{{ task().id | slice : 0 : 8 }} </span>
    </div>

    <!-- Status -->
    <span class="text-xs font-medium px-2 py-1 rounded-full">
      {{ task().status }}
    </span>
  </div>

  <!-- Description -->
  <p class="text-sm text-gray-600 line-clamp-3">
    {{ task().description || 'No description provided.' }}
  </p>

  <!-- Meta -->
  <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-gray-500">
    <div class="flex items-center gap-2">
      <span>Due:</span>
      <span class="font-medium text-gray-700">
        {{ task().dueDate | date : 'mediumDate' }}
      </span>
    </div>

    <div class="flex items-center gap-3">
      <!-- Edit -->
      <button
        class="text-blue-600 hover:text-blue-800 transition font-medium"
        (click)="editTask(task().id)"
      >
        Edit
      </button>

      <!-- Delete -->
      <button
        class="text-red-600 hover:text-red-800 transition font-medium"
        (click)="deleteTask(task().id)"
      >
        Delete
      </button>
    </div>
  </div>
</div>
