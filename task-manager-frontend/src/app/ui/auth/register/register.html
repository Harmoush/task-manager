<div class="max-w-md mx-auto mt-12 p-6 bg-white shadow-md rounded-lg">
  <h2 class="text-2xl font-bold mb-4">Register</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-4">
      <label class="block mb-1 font-medium">First Name</label>
      <input type="text" formControlName="firstName" class="w-full border rounded px-3 py-2" />
    </div>

    <div class="mb-4">
      <label class="block mb-1 font-medium">Last Name</label>
      <input type="text" formControlName="lastName" class="w-full border rounded px-3 py-2" />
    </div>

    <div class="mb-4">
      <label class="block mb-1 font-medium">Email</label>
      <input type="email" formControlName="email" class="w-full border rounded px-3 py-2" />
    </div>

    <div class="mb-4">
      <label class="block mb-1 font-medium">Phone Number</label>
      <input type="text" formControlName="phoneNumber" class="w-full border rounded px-3 py-2" />
    </div>

    <div class="mb-4">
      <label class="block mb-1 font-medium">Password</label>
      <input type="password" formControlName="password" class="w-full border rounded px-3 py-2" />
    </div>

    <div class="mb-4">
      <label class="block mb-1 font-medium">Confirm Password</label>
      <input
        type="password"
        formControlName="confirmPassword"
        class="w-full border rounded px-3 py-2"
      />
    </div>
    @if(error()){
    <div class="mb-4 text-red-600">{{ error() }}</div>
    } @if(success()){
    <div class="mb-4 text-green-600">Registration successful!</div>
    }

    <button
      type="submit"
      class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition"
    >
      Register
    </button>
  </form>
</div>
