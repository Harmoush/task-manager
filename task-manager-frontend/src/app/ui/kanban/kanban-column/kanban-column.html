<div
  class="bg-gray-100 rounded-xl p-4 min-h-[500px] h-full"
  [id]="status()"
  cdkDropList
  [cdkDropListData]="tasks()"
  [cdkDropListConnectedTo]="connectedTo"
  (cdkDropListDropped)="onDrop($event)"
>
  <h2 class="font-semibold text-gray-700 mb-4">{{ title() }} ({{ tasks()!.length }})</h2>

  <div class="space-y-3">
    @for (task of tasks(); track task.id) {
    <app-task-card
      cdkDrag
      [cdkDragData]="task"
      [task]="task"
      (deleted)="deleteTask(task.id)"
      (edited)="editTask(task.id)"
    >
    </app-task-card>
    }
  </div>
</div>
